name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch — saves runner minutes when a
# series of pushes lands quickly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Keep this public-repository check on an isolated hosted runner; it needs
    # no self-hosted capabilities.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Verify dist/ is intact
        run: test -f dist/cli.js && test -f dist/mcp-server.js

  smoke:
    timeout-minutes: 20
    name: clean-room install smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # install-smoke.sh runs npm pack (which triggers the prepack hook =
      # check + build) then installs the tarball into a stock node:20
      # container. The hosted runner provides Docker.
      - run: bash scripts/install-smoke.sh
